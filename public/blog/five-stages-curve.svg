<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="630" fill="#faf9f6"/>
  <text x="60" y="70" font-size="30" font-weight="800" fill="#111">The five stages of AI grief</text>
  <text x="60" y="104" font-size="17" fill="#555">Kübler-Ross, applied to a developer and a Copilot subscription.</text>

  <!-- axes -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M70 150V545H1140"/>
  </g>
  <text x="84" y="166" font-size="13" fill="#888">morale</text>
  <text x="1140" y="572" font-size="13" fill="#888" text-anchor="end">time since the first autocomplete</text>
  <g stroke="#e4e1db" stroke-width="1.5">
    <path d="M72 260H1140M72 370H1140M72 470H1140"/>
  </g>

  <!-- the curve -->
  <path d="M90 205 C130 205,160 212,190 222 C260 245,300 322,370 332 C440 342,500 286,560 290 C640 296,690 462,760 462 C840 462,930 240,1010 218 C1050 207,1080 200,1120 196" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <g fill="#ff5c00" stroke="#111" stroke-width="2.5">
    <circle cx="190" cy="222" r="9"/><circle cx="370" cy="332" r="9"/><circle cx="560" cy="290" r="9"/><circle cx="760" cy="462" r="9"/><circle cx="1010" cy="218" r="9"/>
  </g>

  <!-- stages -->
  <g font-size="16" font-weight="800" fill="#111">
    <text x="150" y="182">1 · DENIAL</text>
    <text x="300" y="378">2 · ANGER</text>
    <text x="470" y="236">3 · BARGAINING</text>
    <text x="560" y="506">4 · DEPRESSION</text>
    <text x="800" y="176">5 · ACCEPTANCE</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="150" y="202">"just spicy autocomplete"</text>
    <text x="300" y="398">"vibe coders will burn it all"</text>
    <text x="470" y="256">"I'll be a prompt engineer"</text>
    <text x="560" y="526">"why even open VS Code?"</text>
    <text x="800" y="196">"a problem-solver. next question"</text>
  </g>

  <text x="60" y="610" font-size="14" fill="#888">moubarak.dev · satire · a developer's obituary</text>
</svg>
