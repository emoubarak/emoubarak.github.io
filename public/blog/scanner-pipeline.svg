<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="630" fill="#faf9f6"/>
  <text x="60" y="70" font-size="30" font-weight="800" fill="#111">Reading a stranger's business card, safely</text>
  <text x="60" y="104" font-size="17" fill="#555">Piktechs AI card scanner: guard rails first, then three tiers that never share a failure</text>
  <!-- input -->
  <rect x="60" y="170" width="200" height="300" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="160" y="205" font-size="15" font-weight="700" fill="#111" text-anchor="middle">INPUT</text>
  <rect x="85" y="225" width="150" height="90" fill="#f0eeeb" stroke="#111" stroke-width="2"/>
  <text x="160" y="262" font-size="14" fill="#111" text-anchor="middle">photo of a</text>
  <text x="160" y="282" font-size="14" fill="#111" text-anchor="middle">paper card</text>
  <rect x="120" y="335" width="80" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M132 347h20v20h-20zM168 347h20v20h-20zM132 383h20v20h-20zM172 387h12v12h-12z" fill="#111"/>
  <text x="160" y="448" font-size="13" fill="#ff5c00" text-anchor="middle" font-weight="700">attacker-controlled</text>
  <!-- arrow -->
  <path d="M262 320h48" stroke="#111" stroke-width="3"/><path d="M310 312l14 8-14 8z" fill="#111"/>
  <!-- guard rails -->
  <rect x="330" y="150" width="330" height="340" fill="#111" stroke="#111" stroke-width="3"/>
  <text x="495" y="186" font-size="15" font-weight="700" fill="#ff5c00" text-anchor="middle">GUARD RAILS, BEFORE ANY SPEND</text>
  <g font-size="15" fill="#faf9f6">
    <text x="352" y="222">▪ signed-in users only</text>
    <text x="352" y="260">▪ quota reserved under a lock</text>
    <text x="368" y="284" font-size="13" fill="#aaa">consumed even if the call fails</text>
    <text x="352" y="322">▪ fixed prompt, strict JSON out</text>
    <text x="368" y="346" font-size="13" fill="#aaa">can't be reused as a free LLM</text>
    <text x="352" y="384">▪ image bytes checked and capped</text>
    <text x="352" y="422">▪ QR links: https only</text>
    <text x="368" y="446" font-size="13" fill="#aaa">private ranges blocked,</text>
    <text x="368" y="468" font-size="13" fill="#aaa">model URLs never fetched</text>
  </g>
  <path d="M662 320h40" stroke="#111" stroke-width="3"/><path d="M702 312l14 8-14 8z" fill="#111"/>
  <!-- tiers -->
  <g font-size="15">
    <rect x="722" y="150" width="300" height="96" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="742" y="184" font-weight="800" fill="#ff5c00">1</text>
    <text x="770" y="184" font-weight="700" fill="#111">Primary vision model</text>
    <text x="770" y="212" font-size="13" fill="#555">best fields per card</text>
    <rect x="722" y="272" width="300" height="96" fill="#fff" stroke="#ff5c00" stroke-width="3"/>
    <text x="742" y="306" font-weight="800" fill="#ff5c00">2</text>
    <text x="770" y="306" font-weight="700" fill="#111">Fallback, other provider</text>
    <text x="770" y="334" font-size="13" fill="#555">chosen by injection test</text>
    <rect x="722" y="394" width="300" height="96" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="742" y="428" font-weight="800" fill="#ff5c00">3</text>
    <text x="770" y="428" font-weight="700" fill="#111">On-device OCR</text>
    <text x="770" y="456" font-size="13" fill="#555">last resort, never a dead end</text>
  </g>
  <path d="M872 248v22M872 370v22" stroke="#111" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M1024 320h40" stroke="#111" stroke-width="3"/><path d="M1064 312l14 8-14 8z" fill="#111"/>
  <rect x="1082" y="270" width="80" height="100" fill="#0055ff" stroke="#111" stroke-width="3"/>
  <text x="1122" y="314" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">contact</text>
  <text x="1122" y="334" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">JSON</text>
  <text x="60" y="560" font-size="16" fill="#111">One quota slot covers the whole request, fallback included: an outage is not the user's fault.</text>
  <text x="60" y="590" font-size="14" fill="#888">moubarak.dev · case study</text>
</svg>
