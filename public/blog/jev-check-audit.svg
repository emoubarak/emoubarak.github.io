<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="630" fill="#faf9f6"/>
  <rect x="60" y="50" width="1080" height="470" fill="#111" stroke="#111" stroke-width="3"/>
  <rect x="60" y="50" width="1080" height="44" fill="#2a2a2a"/>
  <circle cx="88" cy="72" r="7" fill="#ff5c00"/><circle cx="112" cy="72" r="7" fill="#888"/><circle cx="136" cy="72" r="7" fill="#888"/>
  <text x="600" y="78" font-size="15" fill="#aaa" text-anchor="middle">jevcheck audit · staging · as a fresh free account</text>
  <g font-size="19">
    <text x="90" y="140" fill="#888">$ <tspan fill="#faf9f6">jevcheck audit</tspan></text>
    <text x="90" y="184" fill="#faf9f6">== free_publish_blocked: a free account cannot publish a second project</text>
    <text y="224" fill="#aaa"><tspan x="190" text-anchor="end">995 ms</tspan><tspan x="230">ready</tspan><tspan x="340">Publish</tspan></text>
    <text y="260" fill="#aaa"><tspan x="190" text-anchor="end">1412 ms</tspan><tspan x="230" fill="#5bd16b" font-weight="700">done</tspan><tspan x="340">Publish</tspan></text>
    <text x="640" y="260" fill="#5bd16b">← the agent: "done"</text>
    <text y="316" fill="#ff5c00" font-weight="800"><tspan x="90">FAIL</tspan><tspan x="170">free_publish_blocked</tspan><tspan x="460">as free</tspan><tspan x="570">1 act</tspan><tspan x="655">2 calls</tspan><tspan x="760">1.3s</tspan></text>
    <text x="120" y="356" fill="#faf9f6">✗ draft_still_unpublished</text>
    <text x="120" y="390" fill="#faf9f6">✗ live_one_untouched</text>
    <text x="120" y="424" fill="#faf9f6">✗ user_saw_the_paywall</text>
    <text x="120" y="458" fill="#faf9f6">✗ paywall_states_the_reason</text>
    <text x="640" y="390" fill="#ff5c00">← the database: no</text>
  </g>
  <text x="60" y="570" font-size="24" font-weight="800" fill="#111">The agent's "done" is a claim. The database gives the verdict.</text>
  <text x="60" y="600" font-size="14" fill="#888">jev-check · open source (MIT) · demo app with a silent billing regression</text>
</svg>
