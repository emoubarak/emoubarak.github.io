<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#faf9f6"/>
  <text x="60" y="70" font-size="30" font-weight="800" fill="#111">The Great Work, on a Bitcoin coin flip</text>
  <text x="60" y="104" font-size="17" fill="#555">Four alchemical stages of trying to beat Polymarket's 5-minute markets. Every one turned back into lead.</text>

  <g font-size="16">
    <rect x="60" y="160" width="250" height="150" fill="#111" stroke="#111" stroke-width="3"/>
    <text x="80" y="196" font-weight="800" fill="#ff5c00">1 · NIGREDO</text>
    <text x="80" y="228" font-size="14" fill="#faf9f6">mystic bots, live paper</text>
    <text x="80" y="252" font-size="14" fill="#faf9f6">gurdjieff, kabbalah, tao</text>
    <text x="80" y="290" font-size="14" font-weight="700" fill="#ff5c00">✗ all negative</text>

    <rect x="340" y="160" width="250" height="150" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="360" y="196" font-weight="800" fill="#ff5c00">2 · ALBEDO</text>
    <text x="360" y="228" font-size="14" fill="#111">the backtest: quotes</text>
    <text x="360" y="252" font-size="14" fill="#111">were 56 s stale</text>
    <text x="360" y="290" font-size="14" font-weight="700" fill="#ff5c00">✗ lookahead artifact</text>

    <rect x="620" y="160" width="250" height="150" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="640" y="196" font-weight="800" fill="#ff5c00">3 · CITRINITAS</text>
    <text x="640" y="228" font-size="14" fill="#111">coagula: won 84.5 %,</text>
    <text x="640" y="252" font-size="14" fill="#111">break-even 85.2 %</text>
    <text x="640" y="290" font-size="14" font-weight="700" fill="#ff5c00">✗ a cherry-picked cell</text>

    <rect x="900" y="160" width="240" height="150" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="920" y="196" font-weight="800" fill="#ff5c00">4 · RUBEDO</text>
    <text x="920" y="228" font-size="14" fill="#111">zlead survives out</text>
    <text x="920" y="252" font-size="14" fill="#111">of sample</text>
    <text x="920" y="290" font-size="14" font-weight="700" fill="#555">≈ 0 after fees</text>
  </g>
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M310 235H334" marker-end="url(#ah)"/>
    <path d="M590 235H614" marker-end="url(#ah)"/>
    <path d="M870 235H894" marker-end="url(#ah)"/>
  </g>

  <g stroke="#111" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M1020 310V380H600V404"/></g>
  <rect x="300" y="404" width="600" height="118" fill="#fff" stroke="#ff5c00" stroke-width="3"/>
  <text x="324" y="442" font-size="16" font-weight="800" fill="#ff5c00">5 · LAPIS, THE STONE (SOMEONE ELSE'S)</text>
  <text x="324" y="474" font-size="15" fill="#111">the wallet making money was not predicting:</text>
  <text x="324" y="500" font-size="15" fill="#111">it collected <tspan font-weight="800">maker rebates</tspan>, a share of the fees</text>

  <text x="60" y="585" font-size="22" font-weight="800" fill="#111">The market is efficient. Lead remains lead.</text>
  <text x="60" y="612" font-size="14" fill="#888">moubarak.dev · satire · polymarket up/down lab</text>
</svg>
