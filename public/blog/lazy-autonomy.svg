<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="630" fill="#faf9f6"/>
  <text x="60" y="70" font-size="30" font-weight="800" fill="#111">Safe to walk away</text>
  <text x="60" y="104" font-size="17" fill="#555">If I do something twice, a machine does it the third time. What it needs to work alone:</text>
  <!-- center -->
  <rect x="460" y="290" width="280" height="110" fill="#111" stroke="#111" stroke-width="3"/>
  <text x="600" y="337" font-size="20" font-weight="800" fill="#ff5c00" text-anchor="middle">an agent</text>
  <text x="600" y="367" font-size="20" font-weight="800" fill="#faf9f6" text-anchor="middle">working alone</text>
  <g stroke="#111" stroke-width="2" stroke-dasharray="6 5">
    <path d="M340 205L460 300M600 240V290M860 205L740 300M340 485L460 395M600 450V400M860 485L740 395"/>
  </g>
  <g font-size="16">
    <rect x="60" y="150" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="80" y="184" font-weight="800" fill="#ff5c00">1 · END CONDITION</text>
    <text x="80" y="214" font-size="14" fill="#111">done = observable, checked</text>
    <rect x="435" y="150" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="455" y="184" font-weight="800" fill="#ff5c00">2 · BUDGET</text>
    <text x="455" y="214" font-size="14" fill="#111">a cap instead of a question</text>
    <rect x="810" y="150" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="830" y="184" font-weight="800" fill="#ff5c00">3 · EYES</text>
    <text x="830" y="214" font-size="14" fill="#111">screenshots, CI, SQL, browser</text>
    <rect x="60" y="450" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="80" y="484" font-weight="800" fill="#ff5c00">4 · STOP POINTS</text>
    <text x="80" y="514" font-size="14" fill="#111">money, prod, publishing, passwords</text>
    <rect x="435" y="450" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="455" y="484" font-weight="800" fill="#ff5c00">5 · A WAY TO CALL ME</text>
    <text x="455" y="514" font-size="14" fill="#111">notify, leave the screen open</text>
    <rect x="810" y="450" width="330" height="90" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="830" y="484" font-weight="800" fill="#ff5c00">6 · REVERSIBLE</text>
    <text x="830" y="514" font-size="14" fill="#111">branches, test envs, commits</text>
  </g>
  <text x="60" y="600" font-size="14" fill="#888">moubarak.dev · lazy by design</text>
</svg>
