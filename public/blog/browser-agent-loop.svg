<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#faf9f6"/>
  <text x="60" y="70" font-size="30" font-weight="800" fill="#111">A browser agent at work</text>
  <text x="60" y="104" font-size="17" fill="#555">One narrow goal per call. The agent clicks, the data judges, a human types the passwords.</text>

  <!-- the loop -->
  <g font-size="16">
    <rect x="60" y="160" width="240" height="96" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="80" y="195" font-weight="800" fill="#ff5c00">1 · GOAL</text>
    <text x="80" y="226" font-size="14" fill="#111">one narrow task</text>
    <rect x="340" y="160" width="240" height="96" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="360" y="195" font-weight="800" fill="#ff5c00">2 · READ</text>
    <text x="360" y="226" font-size="14" fill="#111">elements + page text</text>
    <rect x="620" y="160" width="240" height="96" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="640" y="195" font-weight="800" fill="#ff5c00">3 · DECIDE</text>
    <text x="640" y="226" font-size="14" fill="#111">one model call</text>
    <rect x="900" y="160" width="240" height="96" fill="#111" stroke="#111" stroke-width="3"/>
    <text x="920" y="195" font-weight="800" fill="#ff5c00">4 · ACT</text>
    <text x="920" y="226" font-size="14" fill="#faf9f6">click, type, scroll</text>
  </g>
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M300 208H334" marker-end="url(#ah)"/>
    <path d="M580 208H614" marker-end="url(#ah)"/>
    <path d="M860 208H894" marker-end="url(#ah)"/>
    <path d="M1020 256V300H460V262" stroke-dasharray="7 6" marker-end="url(#ah)"/>
  </g>
  <text x="740" y="326" font-size="14" fill="#555" text-anchor="middle">observe again, until the goal is met</text>

  <!-- the two exits -->
  <g stroke="#111" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M520 300V384"/>
    <path d="M900 300V384"/>
  </g>
  <rect x="60" y="384" width="510" height="150" fill="#fff" stroke="#ff5c00" stroke-width="3"/>
  <text x="84" y="422" font-size="16" font-weight="800" fill="#ff5c00">"DONE" IS A CLAIM</text>
  <text x="84" y="454" font-size="15" fill="#111">the database gives the verdict</text>
  <rect x="84" y="474" width="462" height="38" fill="#111"/>
  <text x="100" y="499" font-size="14" fill="#faf9f6"><tspan fill="#888">sql&gt;</tspan> check the account state <tspan fill="#5bd16b" font-weight="700">pass</tspan> / <tspan fill="#ff5c00" font-weight="700">fail</tspan></text>
  <rect x="630" y="384" width="510" height="150" fill="#111" stroke="#111" stroke-width="3"/>
  <text x="654" y="422" font-size="16" font-weight="800" fill="#ff5c00">LOGIN · CAPTCHA · 2FA</text>
  <text x="654" y="454" font-size="15" fill="#faf9f6">the agent stops and hands me the tab</text>
  <text x="654" y="486" font-size="15" fill="#faf9f6">I type, it carries on</text>
  <text x="654" y="514" font-size="13" fill="#888">it never sees a password field</text>

  <text x="60" y="600" font-size="14" fill="#888">moubarak.dev · browser agents at work · QA as real accounts, consoles with no API</text>
</svg>
